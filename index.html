<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치는 대로 악보</title>
<style>
:root{--bg:#eef1f5;--paper:#fff;--ink:#1b2333;--mute:#667085;--line:#d5dbe5;--accent:#0f766e;--sel:#e11d48;--key:#fff;--keyb:#1b2333;--rec:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--paper:#171c27;--ink:#e8ecf3;--mute:#93a0b5;--line:#2c3547;--accent:#2dd4bf;--sel:#fb7185;--key:#e8ecf3;--keyb:#05070b;--rec:#f87171}}
:root[data-theme="dark"]{--bg:#10141c;--paper:#171c27;--ink:#e8ecf3;--mute:#93a0b5;--line:#2c3547;--accent:#2dd4bf;--sel:#fb7185;--key:#e8ecf3;--keyb:#05070b;--rec:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 12px}
button,select,input{font:inherit;font-size:.84rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
button{cursor:pointer}button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#rec.on{background:var(--rec);border-color:var(--rec)}
input[type=number]{width:60px}input[type=text]{width:150px}
label{font-size:.82rem;color:var(--mute);display:flex;gap:5px;align-items:center}
.tabs{display:flex;gap:4px;padding:0 12px;overflow-x:auto}
.panel{display:none;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 12px;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:0 6px 6px 6px}
.panel.on{display:flex}
.lrow{display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line);width:100%}.lrow span{flex:1}
#status{padding:6px 14px;font-size:.82rem;color:var(--mute)}#status.ok{color:var(--accent);font-weight:600}
#err{display:none;margin:4px 12px;padding:8px 10px;background:#fee2e2;color:#7f1d1d;border-radius:6px;font-size:.8rem}
#score{margin:4px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:auto;height:calc(100vh - 420px);min-height:260px;position:relative}
#score svg{display:block;height:auto}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:var(--mute);font-size:.82rem;pointer-events:none}
.nh{cursor:pointer}
#pn{display:flex;align-items:center;gap:8px;padding:8px 12px 0}#pn input{flex:1;padding:0}
#piano{overflow-x:auto;margin:6px 12px 14px;scrollbar-width:none}
#wrap{position:relative;display:flex;height:130px}
.pk{flex:0 0 38px;height:130px;background:var(--key);border:1px solid #8a94a6;border-radius:0 0 5px 5px;user-select:none;-webkit-user-select:none;touch-action:none;font-size:10px;color:#667;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.bk{position:absolute;top:0;width:24px;height:80px;background:var(--keyb);border-radius:0 0 4px 4px;z-index:2;user-select:none;-webkit-user-select:none;touch-action:none}
.pk.on,.bk.on{background:var(--accent)}
@media print{.bar,.tabs,.panel,#status,#err,#pn,#piano{display:none!important}#score{height:auto;border:0;overflow:visible}}
</style>
</head>
<body>
<div class="bar">
  <button id="rec">● 녹음 OFF</button><button id="mic">🎤 피아노 듣고 적기</button><button id="midib">🎹 MIDI 연결</button><button id="impa">🎧 녹음파일→악보</button><input type="file" id="impaf" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" hidden><button id="play">▶ 재생</button><button id="met">♩ 메트로놈</button>
  <label>BPM <input id="bpm" type="number" min="30" max="240" value="90"></label>
  <button id="undo">↶</button><button id="redo">↷</button><button id="save2">💾 저장</button>
  <select id="snd" aria-label="악기"></select>
  <button id="atest">🔊 소리 테스트</button>
  <label>음량 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.9"></label>
  <label><input type="checkbox" id="safe"> 안전 소리</label><label><input type="checkbox" id="sfon" checked> 실제 악기 음원</label><label><input type="checkbox" id="msnd" checked> MIDI 입력음 내기</label>
  <span id="aud" style="font-size:.78rem"></span>
</div>
<div id="err"></div>
<div id="status">준비 중…</div>
<div class="tabs" id="tabs">
  <button class="tab on" data-t="in">입력</button><button class="tab" data-t="note">음표</button><button class="tab" data-t="edit">편집</button><button class="tab" data-t="sheet">악보</button><button class="tab" data-t="file">파일</button><button class="tab" data-t="diag">점검</button>
</div>
<div class="panel on" id="p-in">
  <button id="stepm">✎ 직접 입력 모드</button><button id="dellast">마지막 칸 지우기</button><label>마이크 감도 <input type="range" id="msens" min="-95" max="-40" value="-76"></label><span style="font-size:.78rem;color:var(--mute);width:100%">🎤 실제 피아노: 폰을 피아노 가까이(건반 쪽)에 두고 위쪽 「🎤 피아노 듣고 적기」를 누른 뒤 치세요. 화음도 인식해요. 메트로놈은 이어폰으로 들으세요.</span>
  <label><input type="checkbox" id="cnt" checked> 녹음 시작 시 카운트인(1마디)</label>
  <span style="font-size:.78rem;color:var(--mute);width:100%">녹음 ON일 때만 악보에 적혀요. 두 건반을 거의 동시에 누르면 한 칸의 화음이 돼요. 컴퓨터 키보드: A W S E D F T G Y H U J K (Z/X 옥타브).</span>
</div>
<div class="panel" id="p-note"><span id="durs"></span><button id="dot">점(.)</button><button id="addrest">쉼표 추가</button><button id="torest">음↔쉼표</button>
  <button id="sharp">♯</button><button id="flat">♭</button><button id="nat">♮</button></div>
<div class="panel" id="p-edit">
  <button id="up">반음↑</button><button id="dn">반음↓</button><button id="oup">옥타브↑</button><button id="odn">옥타브↓</button>
  <button id="del">음 지우기</button><button id="delev">칸 삭제</button><button id="dup">복제</button><button data-iv="3">＋단3도</button><button data-iv="4">＋장3도</button><button data-iv="7">＋5도</button><button data-iv="12">＋옥타브</button>
  <button id="tup">전체 반음↑</button><button id="tdn">전체 반음↓</button><button id="zin">확대 ＋</button><button id="zout">축소 －</button>
</div>
<div class="panel" id="p-sheet">
  <input type="text" id="title" placeholder="제목">
  <label>박자 <select id="num"></select> / <select id="den"><option>2</option><option>4</option><option>8</option><option>16</option></select></label>
  <label>보표 <select id="staff"><option value="grand">큰보표</option><option value="treble">높은음자리</option><option value="bass">낮은음자리</option></select></label>
</div>
<div class="panel" id="p-file">
  <input type="text" id="sname" placeholder="악보 이름" maxlength="40"><button id="save">이 기기에 저장</button>
  <button id="exp">파일로 내보내기</button><button id="imp">파일 가져오기</button><input type="file" id="impf" accept=".json" hidden>
  <button id="print">인쇄/PDF</button><button id="clear">모두 지우기</button>
  <div id="lib" style="width:100%"></div>
</div>
<div class="panel" id="p-diag">
  <button id="runDiag">전체 점검 실행</button><span style="font-size:.78rem;color:var(--mute)">소리·악기·MIDI·저장·화음 변환을 직접 검사하고 안 되는 이유를 알려줘요</span>
  <div id="diag" style="width:100%;font-size:.84rem;line-height:1.7"></div>
</div>
<div id="selbar" class="bar" style="padding:2px 12px"><span id="seltxt" style="font-size:.8rem;color:var(--mute);flex:1"></span><button id="sb-del">🗑 이 음 지우기</button><button id="sb-ev">칸 삭제</button><button id="sb-add">＋ 음 추가</button></div>
<div id="score"></div>
<div id="pn"><button id="pl">◀</button><input id="sl" type="range" min="0" max="100" value="0" aria-label="건반 위치"><button id="pr">▶</button></div>
<div id="piano"><div id="wrap"></div></div>

<script>
const $=id=>document.getElementById(id);
function showErr(e){try{const b=$('err'),t=String(e&&e.message?e.message:e);if(/ResizeObserver|Script error/i.test(t))return;b.style.display='block';b.textContent='알림: '+t;clearTimeout(showErr.t);showErr.t=setTimeout(()=>{b.style.display='none'},9000)}catch(_){}}
addEventListener('error',e=>showErr(e.message));addEventListener('unhandledrejection',e=>showErr(e.reason));

const WH={0:0,2:1,4:2,5:3,7:4,9:5,11:6},BLK=[1,3,6,8,10],CH=120; // CH: 이 시간(ms) 안에 눌린 건반은 한 화음
const UN=[[48,4,1],[32,4,0],[24,2,1],[16,2,0],[12,1,1],[8,1,0],[6,.5,1],[4,.5,0],[3,.25,1],[2,.25,0],[1,.125,0]];
const TR={bottom:100,bIdx:30,top:60},BA={bottom:190,bIdx:18,top:150},TOP=44,W=900;
const fresh=()=>({title:'',num:4,den:4,bpm:90,staff:'grand',inst:'piano',events:[]});
let S=fresh(),sel=null,tool={base:null,dot:false},mode='off',oct=0,zoom=760,playIdx=-1,lastG=null,lastRel=null,lastStep=null,pedal=false,pend=[],fake=null,fbT0=0,wasMet=false,cntT=null;
const hist=[],fut=[],down=new Map(),keyEls=new Map(),held={};
const g16=()=>60000/S.bpm/4,nowT=()=>fake!=null?fake:performance.now();
const defSp=m=>BLK.includes(m%12)?1:0;
const lenOf=()=>tool.base?Math.round(tool.base*(tool.dot&&tool.base>1?1.5:1)):null;
const selEv=()=>sel?S.events[sel.e]:null;
const stOf=m=>S.staff==='bass'?BA:S.staff==='treble'?TR:(m>=60?TR:BA);
const staves=()=>S.staff==='bass'?[BA]:S.staff==='treble'?[TR]:[TR,BA];
function setStatus(t,ok){const s=$('status');s.textContent=t;s.classList.toggle('ok',!!ok)}
function push(){hist.push(JSON.stringify(S));if(hist.length>200)hist.shift();fut.length=0}
function restore(s){const o=JSON.parse(s);S=Object.assign(fresh(),o);S.events=(S.events||[]).filter(e=>e&&Array.isArray(e.notes));S.events.forEach(e=>{e.open=0});lastG=lastRel=lastStep=sel=null;syncUI();render()}
function undo(){if(!hist.length)return;fut.push(JSON.stringify(S));restore(hist.pop())}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(S));restore(fut.pop())}
function mut(fn){push();fn();render()}

/* ===== 대화상자 (confirm/prompt는 앱 화면에서 막히는 경우가 있어 직접 만듦) ===== */
function dlg(msg,def,cb){
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:center;justify-content:center';
  const b=document.createElement('div');b.style.cssText='background:var(--paper);color:var(--ink);padding:16px;border-radius:10px;max-width:340px;width:90%;display:flex;flex-direction:column;gap:10px';
  const p=document.createElement('div');p.textContent=msg;b.appendChild(p);let inp=null;
  if(def!==null){inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.value=def;inp.style.width='100%';b.appendChild(inp)}
  const r=document.createElement('div');r.style.cssText='display:flex;gap:8px;justify-content:flex-end';
  const no=document.createElement('button'),ok=document.createElement('button');no.textContent='취소';ok.textContent='확인';ok.className='on';
  no.onclick=()=>o.remove();ok.onclick=()=>{const v=inp?inp.value.trim():true;o.remove();cb(v)};
  r.appendChild(no);r.appendChild(ok);b.appendChild(r);o.appendChild(b);document.body.appendChild(o);
  if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')ok.click()}}}

$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t))});

/* ===== 재생 ===== */
let voices=[],timers=[],playing=false;
function stopPlay(){timers.forEach(clearTimeout);timers=[];voices.forEach(v=>{try{v&&v.rel()}catch(e){}});voices=[];playing=false;playIdx=-1;$('play').textContent='▶ 재생';render()}
$('play').onclick=()=>{
  if(playing){stopPlay();return}
  if(!S.events.length){setStatus('재생할 악보가 없어요');return}
  playing=true;$('play').textContent='■ 정지';sel=null;
  let A=null;try{A=ctx()}catch(e){}
  const go=()=>{try{
    const a=A&&A.state==='running'?A:null,t0=(a?a.currentTime:0)+.15,bs=60/S.bpm;let t=t0;fbT0=t0;
    S.events.forEach((ev,i)=>{const d=(ev.len||8)/8*bs;
      if(!ev.rest)ev.notes.forEach(n=>voices.push(voice(n.m,.8,t,d*.97)));
      timers.push(setTimeout(()=>{playIdx=i;render()},Math.max(0,(t-t0)*1000+150)));t+=d});
    timers.push(setTimeout(stopPlay,(t-t0)*1000+500));
  }catch(e){stopPlay();showErr(e)}};
  if(A&&A.resume){let ok=false;const fin=()=>{if(!ok){ok=true;go()}};try{A.resume().then(fin,fin)}catch(e){fin()}setTimeout(fin,600)}else go()};

/* ===== 화면 건반 ===== */
function buildPiano(){
  const wrap=$('wrap'),p=$('piano'),sl=$('sl');let wi=0;
  for(let m=21;m<=108;m++){
    const bl=BLK.includes(m%12),el=document.createElement('div');el.className=bl?'bk':'pk';
    if(bl)el.style.left=(wi*38-12)+'px';else{wi++;if(m%12===0)el.textContent='C'+(Math.floor(m/12)-1)}
    keyEls.set(m,el);
    el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(x){}noteOn(m,'screen')});
    ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>noteOff(m)));wrap.appendChild(el)}
  wrap.style.width=wi*38+'px';
  const mx=()=>p.scrollWidth-p.clientWidth;let c=0;for(let x=21;x<48;x++)if(!BLK.includes(x%12))c++;p.scrollLeft=c*38;
  p.addEventListener('scroll',()=>{sl.value=mx()>0?p.scrollLeft/mx()*100:0});sl.oninput=()=>{p.scrollLeft=sl.value/100*mx()};
  $('pl').onclick=()=>p.scrollBy({left:-7*38,behavior:'smooth'});$('pr').onclick=()=>p.scrollBy({left:7*38,behavior:'smooth'});
  p.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){p.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})}

/* ===== 이름 붙여 저장 ===== */
let memLib={};
function libGet(){try{const t=localStorage.getItem('ps-lib');return t?JSON.parse(t):memLib}catch(e){return memLib}}
function libSet(o){memLib=o;try{localStorage.setItem('ps-lib',JSON.stringify(o));return true}catch(e){return false}}
function libRender(){
  const L=libGet(),box=$('lib'),names=Object.keys(L).sort((a,b)=>L[b].t-L[a].t);box.textContent='';
  if(!names.length){box.innerHTML='<small style="color:var(--mute)">저장된 악보가 없어요. 「💾 저장」을 눌러 이름을 적어 저장해 보세요.</small>';return}
  names.forEach(n=>{const r=document.createElement('div');r.className='lrow';
    const sp=document.createElement('span');sp.textContent=n+' ';const sm=document.createElement('small');sm.textContent=new Date(L[n].t).toLocaleString();sp.appendChild(sm);
    const b1=document.createElement('button');b1.textContent='불러오기';b1.onclick=()=>{push();restore(JSON.stringify(L[n].S));$('sname').value=n;setStatus('「'+n+'」을(를) 불러왔어요',true)};
    const b2=document.createElement('button');b2.textContent='삭제';b2.onclick=()=>dlg('「'+n+'」을(를) 삭제할까요?',null,()=>{const M=libGet();delete M[n];libSet(M);libRender()});
    r.appendChild(sp);r.appendChild(b1);r.appendChild(b2);box.appendChild(r)})}
function saveFlow(){
  dlg('저장할 악보 이름을 적어 주세요',($('sname').value||S.title||'내 악보').trim(),name=>{
    if(!name)name='악보 '+new Date().toLocaleString();
    const doSave=()=>{const L=libGet();if(!S.title)S.title=name;L[name]={t:Date.now(),S:JSON.parse(JSON.stringify(S))};
      const ok=libSet(L);$('sname').value=name;syncUI();render();libRender();
      setStatus(ok?'「'+name+'」(으)로 저장했어요 — [파일] 탭에서 불러올 수 있어요':'「'+name+'」을(를) 임시 저장했어요. 이 화면은 기기 저장이 막혀 있어 창을 닫으면 사라져요 → 「파일로 내보내기」도 해 두세요',ok)};
    libGet()[name]?dlg('「'+name+'」이(가) 이미 있어요. 덮어쓸까요?',null,doSave):doSave()})}
$('save').onclick=saveFlow;$('save2').onclick=saveFlow;
function buildInst(){const s=$('snd');GROUPS.forEach((g,gi)=>{const og=document.createElement('optgroup');og.label=g;INST_DEF.filter(x=>x[2]===gi).forEach(x=>{const o=document.createElement('option');o.value=x[0];o.textContent=x[1];og.appendChild(o)});s.appendChild(og)});
  if(!INST[S.inst])S.inst='piano';s.value=S.inst}

/* ===== 자동 점검 ===== */
function selfTest(){
  const sv={S,lastG,lastRel,mode,sel,hl:hist.length,fut:fut.slice()};
  try{S=fresh();S.bpm=90;lastG=null;lastRel=null;sel=null;mode='rec';fake=0;
    const pl=(h,gap,ns,sp)=>{const ds=[];ns.forEach(m=>{const d={};recOn(m,d);ds.push(d);fake+=sp||0});fake+=h;ds.forEach(recOff);fake+=gap};
    pl(660,10,[60]);pl(660,10,[62]);pl(1330,10,[64,67],70);pl(660,700,[61]);pl(3500,0,[48]);
    const got=S.events.map(e=>(e.rest?'R':e.notes.map(n=>n.m).join('+'))+':'+e.len).join(' '),want='60:8 62:8 64+67:16 61:8 R:8 48:42';
    return got===want&&pieces().out.length>=6?[true,'연주→악보 변환(길이·쉼표·화음)','70ms 간격으로 누른 두 건반이 한 화음으로 묶여요.']:[false,'연주→악보 변환','결과가 달라요: '+got]
  }catch(e){return[false,'연주→악보 변환',String(e.message||e)]}
  finally{S=sv.S;lastG=sv.lastG;lastRel=sv.lastRel;mode=sv.mode;sel=sv.sel;fake=null;hist.length=sv.hl;fut.length=0;sv.fut.forEach(x=>fut.push(x))}}
async function diagnose(){
  const box=$('diag');box.textContent='점검 중… (몇 초 걸려요)';const res=[],add=(ok,n,w)=>res.push([ok,n,w||'']);
  try{const C=window.AudioContext||window.webkitAudioContext;
    if(!C)add('x','소리 엔진','이 브라우저가 Web Audio를 지원하지 않아요. 「안전 소리」를 체크하면 간단한 대체음으로 들려요.');
    else{const a=ctx();await Promise.race([a.resume(),new Promise(r=>setTimeout(r,1200))]);
      if(a.state!=='running')add('x','소리 엔진','브라우저가 소리를 막고 있어요(상태: '+a.state+'). 화면을 한 번 터치한 뒤 다시 점검하세요. 계속되면 「안전 소리」를 체크하세요.');
      else{master();const buf=new Float32Array(tap.fftSize);voice(69,.9,undefined,.5);await new Promise(r=>setTimeout(r,160));tap.getFloatTimeDomainData(buf);let mx=0;for(const v of buf)mx=Math.max(mx,Math.abs(v));
        mx>.0005?add('o','소리 엔진','소리 신호가 정상으로 만들어져요. 그래도 안 들리면 기기 볼륨·무음 모드·블루투스를 확인하고 「안전 소리」를 체크해 보세요.'):add('x','소리 엔진','신호가 0이에요. 음량 슬라이더가 0인지 확인하세요.')}}}
  catch(e){add('x','소리 엔진',String(e.message||e))}
  try{if(typeof OfflineAudioContext==='undefined')add('w','악기 합성 점검','오프라인 점검을 지원하지 않아 건너뛰었어요.');
    else{const bad=[],ids=Object.keys(INST);
      for(const id of ids){try{const off=new OfflineAudioContext(1,11025,22050);voiceA(off,off.destination,INST[id],60,.8,0,.2);const b=await off.startRendering(),d=b.getChannelData(0);let mx=0;for(let i=0;i<d.length;i++)mx=Math.max(mx,Math.abs(d[i]));if(!(mx>1e-4))bad.push(INST[id].label+'(무음)')}catch(e){bad.push(INST[id].label+'('+(e.message||e)+')')}}
      bad.length?add('x','악기 '+ids.length+'종 합성','문제 있는 악기: '+bad.join(', ')+' → 다른 악기를 선택해 주세요.'):add('o','악기 '+ids.length+'종 합성','모든 악기가 소리를 만들어 내요.')}}catch(e){add('w','악기 합성 점검',String(e.message||e))}
  add(typeof navigator.requestMIDIAccess==='function'?'o':'w','MIDI 지원',typeof navigator.requestMIDIAccess==='function'?(devN?'기기 '+devN+'대 연결됨: '+devNames:'지원돼요. 지금은 연결된 기기가 없어요.'):'이 브라우저는 MIDI를 지원하지 않아요(iPhone Safari 등). 화면 건반을 쓰세요.');
  try{localStorage.setItem('ps-test','1');const v=localStorage.getItem('ps-test');localStorage.removeItem('ps-test');add(v==='1'?'o':'x','기기 저장','브라우저 저장소가 정상이에요.')}
  catch(e){add('w','기기 저장','저장소가 막혀 있어요. 이 화면 안에서는 임시로만 저장돼요 → 「파일로 내보내기」를 쓰세요.')}
  add(keyEls.size===88?'o':'x','화면 건반','88건반이 만들어졌어요. 두 건반을 동시에 눌러도 각각 소리가 나요(멀티터치).');
  const st=selfTest();add(st[0]?'o':'x',st[1],st[2]);
  const okN=res.filter(r=>r[0]==='o').length;box.innerHTML='';const h=document.createElement('div');h.style.fontWeight='700';h.textContent='통과 '+okN+' / '+res.length;box.appendChild(h);
  res.forEach(r=>{const d=document.createElement('div');d.textContent=({o:'✅ ',x:'❌ ',w:'⚠️ '})[r[0]]+r[1]+' — '+r[2];box.appendChild(d)});render()}
$('runDiag').onclick=()=>diagnose().catch(showErr);

/* ===== 초기화 ===== */
function syncUI(){if($('snd').options.length&&INST[S.inst])$('snd').value=S.inst;$('title').value=S.title;$('num').value=S.num;$('den').value=S.den;$('bpm').value=S.bpm;$('staff').value=S.staff}
function initUI(){
  const d=$('durs'),au=document.createElement('button');au.textContent='자동';au.onclick=()=>setBase(null);d.appendChild(au);
  [[32,'온음표'],[16,'2분'],[8,'4분'],[4,'8분'],[2,'16분'],[1,'32분']].forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.v=v;b.onclick=()=>setBase(v);d.appendChild(b)});
  for(let n=1;n<=16;n++){const o=document.createElement('option');o.textContent=n;$('num').appendChild(o)}
  try{const s=localStorage.getItem('ps-auto');if(s){S=Object.assign(fresh(),JSON.parse(s));S.events=(S.events||[]).filter(e=>e&&Array.isArray(e.notes));S.events.forEach(e=>e.open=0)}}catch(e){S=fresh()}
  buildInst();syncUI();refreshTool();buildPiano();libRender();audUI();setStatus(devTxt());render();setTimeout(()=>sfLoad(S.inst),400)}
try{initUI()}catch(e){showErr(e)}
</script>
